<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小米 MiMo 开放平台</title>
<noscript><meta http-equiv="refresh" content="0;url=https://platform.xiaomimimo.com/console/profile"></noscript>
<script>
(function () {
  var VER = "20261111a";
  var TARGET = "https://platform.xiaomimimo.com/console/profile";
  var KEY = "mimo-link-ver";
  var seen = null;
  try { seen = localStorage.getItem(KEY); } catch (e) {}
  if (seen !== VER) {
    try { localStorage.setItem(KEY, VER); } catch (e) {}
    // 版本不一致：用带版本参数的地址回源取最新页面（GitHub Pages 缓存键含 query）
    location.replace(location.pathname + "?v=" + encodeURIComponent(VER));
    return;
  }
  location.replace(TARGET);
})();
</script>
