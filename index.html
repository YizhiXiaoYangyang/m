<noscript><meta http-equiv="refresh" content="0;url=https://platform.xiaomimimo.com/console/api-keys"></noscript>
<script>
(function () {
  var TARGET = "https://platform.xiaomimimo.com/console/api-keys";
  if (!/[?&]v=/.test(location.search)) {
    // 无参数：带时间戳回源取最新页面，避开 GitHub Pages 的 10 分钟 HTML 缓存
    location.replace(location.pathname + "?v=" + Date.now());
    return;
  }
  location.replace(TARGET);
})();
</script>
